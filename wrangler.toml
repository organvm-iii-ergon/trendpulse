name = "trendpulse"
main = "src/runtime.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"

[ai]
binding = "AI"

# Daily digest at 13:00 UTC; intra-day collection every 4 hours
[triggers]
crons = ["0 1,5,9,13,17,21 * * *"]

[[kv_namespaces]]
binding = "TP_DATA"
id = "18dae05eabbf4d008821c92f21dda75f"

[[kv_namespaces]]
binding = "TP_DIGEST"
id = "26ecf9dc427a403782afceb401958a96"

[vars]
USER_AGENT = "Mozilla/5.0 (compatible; TrendPulse/0.1; +https://trendpulse.ivixivi.workers.dev)"
# Public Lemon Squeezy checkout link for the Pro/Team subscription. Surfaced to
# the landing page via /api/config. Replace with your store's buy URL, e.g.
# https://trendpulse.lemonsqueezy.com/buy/<variant-uuid>
CHECKOUT_URL = "https://trendpulse.lemonsqueezy.com/buy/REPLACE-WITH-VARIANT-ID"
# Optional: From address for email delivery (used only if RESEND_API_KEY is set).
# FROM_EMAIL = "TrendPulse <digest@yourdomain.com>"

# --- Secrets (set with `wrangler secret put`, do NOT commit) ---
# RESEND_API_KEY — enables email delivery for subscribers. Webhook delivery
#                  works without it. License validation needs no secret (the
#                  Lemon Squeezy license key itself is the credential).

[observability]
enabled = true
