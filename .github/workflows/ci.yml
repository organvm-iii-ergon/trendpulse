name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No package-lock.json is committed, so use `npm install` (not `npm ci`)
      # and skip setup-node's npm cache, which needs a lockfile to key on.
      # Commit a lockfile and switch to `npm ci` for faster, reproducible runs.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: KV status quota regression
        run: node --test tests/status-snapshot.test.mjs

      - name: Build (wrangler dry-run)
        run: npm run build
